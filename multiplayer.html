<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz – Többjátékos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-blur">
        <svg preserveAspectRatio="xMidYMid slice" viewBox="10 10 80 80">
            <path fill="#9b5de5" d="M37-5C25.1-14.7,5.7-19.1-9.2-10-28.5,1.8-32.7,31.1-19.8,49c15.5,21.5,52.6,22,67.2,2.3C59.4,35,53.7,8.5,37-5Z"/>
            <path fill="#f15bb5" d="M20.6,4.1C11.6,1.5-1.9,2.5-8,11.2-16.3,23.1-8.2,45.6,7.4,50S42.1,38.9,41,24.5C40.2,14.1,29.4,6.6,20.6,4.1Z"/>
        </svg>
    </div>

    <div id="settings-panel">
        <button id="settings-toggle" type="button">⚙️</button>
        <div id="settings-content" class="hidden">
            <label>
                <span data-i18n="language_label">Nyelv</span>
                <select id="lang-select">
                    <option value="HU-hu">Magyar (HU)</option>
                    <option value="EN-en">English (EN)</option>
                </select>
            </label>
        </div>
    </div>

    <div id="start-screen">
        <h1 data-i18n="mp_mode_title">👥 Többjátékos mód</h1>
        <p class="mp-mode-desc" data-i18n="mp_mode_desc">1 műsorvezető + 2–8 játékos. A műsorvezető a nagy képernyőn, a játékosok telefonról csatlakoznak.</p>
        <a href="host.html" class="mp-mode-btn mp-btn-primary" data-i18n="mp_host_btn">🎤 Műsorvezető</a>
        <a href="player.html" class="mp-mode-btn mp-btn-secondary" data-i18n="mp_player_btn">📱 Játékos</a>
        <a href="index.html" class="mp-back-home" data-i18n="mp_solo_link">← Egyjátékos mód</a>
    </div>

    <script src="shared/multiplayer-client.js"></script>
</body>
</html>
